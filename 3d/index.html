<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>3D-моделі Bluesun</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>
/* ESS product page: 3D stage with a parts rail, datasheet table, EMS demo. Shared by all products of the ess-cabinet template. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#0F1C26; --muted:#4F6270; --line:#D5E0E6;
  --primary:#1D6D8C; --accent:#4ABED8; --brand:#13808F; --amber:#E39B2D; --alarm:#C8462B; --ok:#2E9A6A;
  --stage-a:#EEF3F6; --stage-b:#D3DFE6; --pin:#0F1C26; --pin-fg:#FFFFFF; --chip:#E7EEF2;
  --f-display:'Manrope','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A141B; --surface:#112029; --ink:#E4EDF1; --muted:#98AEBA; --line:#21384A;
    --primary:#4ABED8; --accent:#7FD6EA; --brand:#3FB3C2; --amber:#F0B04A; --alarm:#E86A4E; --ok:#4CC28C;
    --stage-a:#16293448; --stage-b:#0A141B; --pin:#E4EDF1; --pin-fg:#0A141B; --chip:#18303D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A141B; --surface:#112029; --ink:#E4EDF1; --muted:#98AEBA; --line:#21384A;
  --primary:#4ABED8; --accent:#7FD6EA; --brand:#3FB3C2; --amber:#F0B04A; --alarm:#E86A4E; --ok:#4CC28C;
  --stage-a:#16293448; --stage-b:#0A141B; --pin:#E4EDF1; --pin-fg:#0A141B; --chip:#18303D; color-scheme:dark;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-display); font-size:15px; line-height:1.5; }
.wrap{ max-width:1240px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
h1,h2,h3{ text-wrap:balance; margin:0; }
a{ color:var(--primary); }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.top{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--bg); }
.top-in{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:12px; }
.wm{ display:flex; flex-direction:column; line-height:1; }
.wm b{ font-weight:800; font-size:20px; letter-spacing:.14em; }
.wm b i{ font-style:normal; color:var(--accent); }
.wm span{ font-size:8px; letter-spacing:.24em; margin-top:5px; font-weight:600; color:var(--muted); }
.nav{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.nav a{ text-decoration:none; color:var(--ink); font-weight:600; font-size:14px; padding:8px 12px; border-radius:8px; }
.nav a:hover{ background:var(--chip); }

.hero{ padding-block:28px 12px; }
.intro{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:12px 40px; align-items:end; margin-bottom:20px; }
.eyebrow{ font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; color:var(--brand); font-weight:600; grid-column:1/-1; }
h1{ font-size:clamp(30px, 4.2vw, 50px); line-height:1.04; font-weight:800; letter-spacing:-.02em; }
.lead{ margin:0; color:var(--muted); font-size:16px; max-width:58ch; }
.chips{ list-style:none; padding:0; margin:6px 0 0; display:flex; flex-wrap:wrap; gap:8px; grid-column:1/-1; }
.chips li{ background:var(--chip); border-radius:999px; padding:6px 12px; font-size:13.5px; color:var(--muted); }
.chips b{ color:var(--ink); font-family:var(--f-mono); font-weight:600; }

.viewer{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start; }
.stage-col{ min-width:0; }
.stage{ position:relative; aspect-ratio:16/10.5; max-height:74vh; width:100%; border-radius:18px; overflow:hidden; background:radial-gradient(120% 90% at 50% 18%, var(--stage-a), var(--stage-b)); border:1px solid var(--line); touch-action:none; }
.stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
.stage canvas.hot{ cursor:pointer; }
.pins{ position:absolute; inset:0; pointer-events:none; }
.pin{ position:absolute; transform:translate(-50%,-50%); pointer-events:auto; background:none; border:0; padding:0; cursor:pointer; transition:opacity .25s; }
.pin .n{ display:block; width:26px; height:26px; border-radius:50%; background:var(--pin); color:var(--pin-fg); font:600 12px/26px var(--f-mono); text-align:center; box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); }
.pin .t{ position:absolute; left:32px; top:50%; background:var(--surface); color:var(--ink); border:1px solid var(--line); font-size:12.5px; font-weight:700; padding:4px 9px; border-radius:7px; white-space:nowrap; opacity:0; transform:translate(-4px,-50%); transition:opacity .2s, transform .2s; pointer-events:none; }
.pin:hover .t, .pin.active .t, .pin.lab .t, .lab-on .pin .t{ opacity:1; transform:translate(0,-50%); }
.pin.active .n{ background:var(--brand); color:#fff; }
.pin.left .t{ left:auto; right:32px; transform:translate(4px,-50%); }
.pin.fire .n{ background:var(--alarm); color:#fff; box-shadow:0 0 0 4px color-mix(in srgb, var(--alarm) 30%, transparent); }
.seg{ position:absolute; left:12px; top:12px; display:flex; background:color-mix(in srgb, var(--surface) 92%, transparent); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; z-index:2; }
.seg button{ border:0; background:none; color:var(--muted); font-weight:700; font-size:13px; padding:7px 11px; border-radius:8px; cursor:pointer; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.crumb{ position:absolute; left:12px; top:58px; z-index:2; font-size:12.5px; font-weight:600; color:var(--muted); background:color-mix(in srgb, var(--surface) 85%, transparent); padding:5px 10px; border-radius:8px; }
.crumb b{ color:var(--ink); }
.crumb.alarm{ background:var(--alarm); color:#fff; }
.crumb.alarm b{ color:#fff; }
.status{ position:absolute; right:12px; top:12px; z-index:2; background:color-mix(in srgb, var(--surface) 92%, transparent); border:1px solid var(--line); border-radius:11px; padding:7px 11px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px; max-width:calc(100% - 24px); }
.dot{ width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none; }
.dot.off{ background:var(--alarm); }
.dot.blink{ background:var(--alarm); animation:blink .5s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:.2; } }
.emsPanel{ position:absolute; right:12px; top:58px; z-index:3; width:236px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:13px; box-shadow:0 10px 30px rgba(10,20,27,.14); }
.emsPanel .h{ display:flex; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:8px; }
.emsPanel .soc{ height:8px; border-radius:6px; background:var(--chip); overflow:hidden; margin:2px 0 10px; }
.emsPanel .soc i{ display:block; height:100%; width:76%; background:var(--brand); }
.emsPanel dl{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 10px; margin:0 0 8px; }
.emsPanel dt{ color:var(--muted); }
.emsPanel dd{ margin:0; text-align:right; font-family:var(--f-mono); }
.hint{ position:absolute; left:50%; bottom:12px; transform:translateX(-50%); font-size:12px; color:var(--muted); background:color-mix(in srgb, var(--surface) 85%, transparent); padding:5px 10px; border-radius:999px; white-space:nowrap; transition:opacity .6s; z-index:2; }
.loading{ position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-family:var(--f-mono); font-size:13px; }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }
.btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px; padding:9px 14px; border-radius:10px; cursor:pointer; min-height:42px; }
.btn:hover{ border-color:var(--primary); }
.btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.btn[aria-pressed="true"]{ border-color:var(--primary); color:var(--primary); }
.btn.firebtn[aria-pressed="true"]{ border-color:var(--alarm); color:var(--alarm); }
.btn.sm{ min-height:34px; padding:6px 11px; font-size:13px; }
.cap{ margin-top:10px; font-size:12.5px; color:var(--muted); }

.rail{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; min-width:0; }
.rail-h{ font-family:var(--f-mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
.parts{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:2px; }
.parts .row{ width:100%; display:flex; align-items:center; gap:10px; text-align:left; background:none; border:0; border-radius:9px; padding:8px; cursor:pointer; color:var(--ink); font-weight:600; font-size:14px; }
.parts .row:hover, .parts .row.on{ background:var(--chip); }
.parts .k{ width:22px; height:22px; border-radius:50%; flex:none; background:var(--ink); color:var(--bg); font:600 11px/22px var(--f-mono); text-align:center; }
.parts .row.on .k{ background:var(--brand); color:#fff; }
.mods{ display:flex; gap:6px; padding:0 8px 6px 40px; flex-wrap:wrap; }
.mods button{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; font:600 12px var(--f-mono); padding:5px 8px; cursor:pointer; }
.mods button.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
.detail{ border-top:1px solid var(--line); padding-top:14px; }
.detail h3{ font-size:17px; margin-bottom:6px; }
.detail p{ margin:0 0 10px; color:var(--muted); font-size:14px; }
.kv{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:5px 12px; margin:0 0 12px; font-size:13.5px; }
.kv dt{ color:var(--muted); }
.kv dd{ margin:0; font-family:var(--f-mono); font-weight:500; text-align:right; }
.acts{ display:flex; flex-wrap:wrap; gap:6px; }
.small{ font-size:12px; color:var(--muted); margin-top:10px; }

section.block{ padding-block:56px 8px; }
.sec-h{ display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:12px 32px; margin-bottom:22px; }
.sec-h h2{ font-size:clamp(24px, 3vw, 34px); font-weight:800; letter-spacing:-.015em; }
.sec-h p{ margin:0; color:var(--muted); max-width:60ch; }
.specs{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px; }
.spec{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; min-width:0; }
.spec h3{ font-size:13px; font-family:var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--brand); margin-bottom:10px; font-weight:600; }
.spec table{ width:100%; border-collapse:collapse; font-size:14px; }
.spec td{ padding:7px 0; border-top:1px solid var(--line); vertical-align:top; }
.spec tr:first-child td{ border-top:0; }
.spec td:last-child{ text-align:right; font-family:var(--f-mono); font-weight:500; padding-left:12px; }
.spec td:first-child{ color:var(--muted); }
.cert{ margin-top:14px; font-size:13px; color:var(--muted); }

.ems{ display:grid; grid-template-columns:minmax(0,0.85fr) minmax(0,1.6fr); gap:22px; align-items:start; }
.feat{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.feat li{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.feat b{ display:block; font-size:15px; margin-bottom:2px; }
.feat span{ color:var(--muted); font-size:14px; }
.dash{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; min-width:0; }
.dash-h{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.dash-h b{ font-size:16px; }
.tag{ font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--amber); border:1px solid currentColor; border-radius:6px; padding:3px 7px; font-weight:500; }
.kpis{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
.kpi{ background:var(--bg); border-radius:12px; padding:10px 12px; min-width:0; }
.kpi b{ display:block; font-family:var(--f-mono); font-size:20px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
.kpi span{ font-size:12px; color:var(--muted); }
.chart{ overflow-x:auto; }
.chart svg{ display:block; width:100%; min-width:560px; height:auto; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted); margin-top:8px; }
.legend i{ display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; }
.note{ font-size:12.5px; color:var(--muted); margin-top:10px; }

footer{ margin-top:56px; border-top:1px solid var(--line); }
.foot{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:18px 40px; padding-block:26px 34px; font-size:14px; color:var(--muted); }
.foot b{ color:var(--ink); }
.sel{ user-select:all; font-family:var(--f-mono); color:var(--ink); }

.video-mode .top, .video-mode .intro, .video-mode .rail, .video-mode .bar, .video-mode .cap, .video-mode section.block, .video-mode footer, .video-mode .hint, .video-mode .seg, .video-mode .crumb, .video-mode .status{ display:none !important; }
.video-mode .hero{ padding:0; max-width:none; }
.video-mode .viewer{ display:block; }
.video-mode .stage{ width:1280px; height:720px; max-height:none; aspect-ratio:auto; border-radius:0; border:0; }
.vtitle, .vlogo{ display:none; }
.video-mode .vtitle{ display:block; position:absolute; left:28px; bottom:26px; z-index:3; color:var(--ink); max-width:820px; background:color-mix(in srgb, var(--bg) 84%, transparent); padding:12px 16px; border-radius:12px; }
.vtitle .e{ font-family:var(--f-mono); font-size:13px; letter-spacing:.16em; color:var(--brand); font-weight:600; }
.vtitle .h{ font-size:34px; font-weight:800; letter-spacing:-.015em; line-height:1.1; margin-top:4px; }
.vtitle .s{ font-size:16px; color:var(--muted); margin-top:4px; }
.video-mode .vlogo{ display:flex; position:absolute; right:28px; top:22px; z-index:3; background:color-mix(in srgb, var(--bg) 84%, transparent); padding:10px 14px; border-radius:10px; }
.video-mode .emsPanel{ top:96px; right:40px; }

@media (max-width: 960px){
  .viewer{ grid-template-columns:minmax(0,1fr); }
  .intro{ grid-template-columns:minmax(0,1fr); }
  .specs{ grid-template-columns:minmax(0,1fr); }
  .ems{ grid-template-columns:minmax(0,1fr); }
}
@media (max-width: 600px){
  .stage{ aspect-ratio:1/1.1; }
  .kpis{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .nav{ display:none; }
  .hint{ display:none; }
  .crumb{ top:auto; bottom:12px; }
  .emsPanel{ top:auto; bottom:12px; left:12px; right:12px; width:auto; }
  .status{ top:auto; bottom:12px; }
}
@media (prefers-reduced-motion: reduce){ .pin, .pin .t, .hint{ transition:none; } .dot.blink{ animation:none; } }

.nav .pick{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); padding-left:8px; }
.nav select{ font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 8px; max-width:260px; }
.acc{ display:inline-block; font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; border-radius:6px; padding:2px 7px; margin-right:6px; border:1px solid currentColor; font-weight:600; vertical-align:1px; }
.acc-drawing{ color:var(--ok); } .acc-datasheet{ color:var(--primary); } .acc-photo{ color:var(--amber); } .acc-schematic{ color:var(--alarm); }
.spec tr.flag td{ background:color-mix(in srgb, var(--amber) 13%, transparent); }
.spec tr.flag td:first-child{ padding-left:6px; border-radius:6px 0 0 6px; }
.spec tr.flag td:last-child{ padding-right:6px; border-radius:0 6px 6px 0; }
.srcs{ margin-top:8px; font-size:13px; color:var(--muted); }
.srcs b{ color:var(--ink); }
@media (max-width: 600px){ .nav .pick{ display:none; } }
.stage.night{ background:radial-gradient(120% 90% at 50% 18%, #2A3A4A, #0B141B); }
</style></head>
