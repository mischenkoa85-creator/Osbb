<title>Монтаж СЕС Антарес</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen montage player. The 3D viewport fills the screen; the stage rail sits on top;
   the step card with the transport is docked at the bottom (a left column on wide screens).
   Nothing is drawn as text over the model: names, sizes and counts live in the card. */
:root{
  --paper:#E8EDEE; --panel:#F7F9F9; --ink:#162026; --ink-2:#4D5D65; --rule:#C6D0D4; --rule-2:#DCE3E6;
  --cobalt:#2446A3; --cobalt-soft:#DDE4F6; --sun:#B86E00; --scene:#D9E1E4;
  --st-p:#2446A3; --st-r:#1E6B4E; --st-z:#7A4BA8; --st-o:#A04A05;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1417; --panel:#131B1F; --ink:#E0E7E9; --ink-2:#92A3AA; --rule:#2A3940; --rule-2:#1D282D;
  --cobalt:#93ADFF; --cobalt-soft:#1D2A4A; --sun:#F0B44A; --scene:#1A2429;
  --st-p:#93ADFF; --st-r:#6FD1A6; --st-z:#C9A6F0; --st-o:#F2A866; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1417; --panel:#131B1F; --ink:#E0E7E9; --ink-2:#92A3AA; --rule:#2A3940; --rule-2:#1D282D;
  --cobalt:#93ADFF; --cobalt-soft:#1D2A4A; --sun:#F0B44A; --scene:#1A2429;
  --st-p:#93ADFF; --st-r:#6FD1A6; --st-z:#C9A6F0; --st-o:#F2A866; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%;min-height:0}
.bar{flex:none;display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--rule)}
.bar h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.01em;text-wrap:balance}
.bar span{color:var(--ink-2);font-size:12.5px}
.bar .code{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em}

.view{position:relative;flex:1 1 auto;min-height:0;background:var(--scene);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-family:var(--f-mono);font-size:12px;padding:16px;text-align:center}

/* stage rail */
.rail{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:calc(118px + env(safe-area-inset-right,0px));display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;z-index:5}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.rail button i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.rail button.on{background:var(--cobalt);border-color:var(--cobalt);color:var(--panel)}
.rail button.on i{color:var(--panel);opacity:.8}
.rail button.done{border-color:var(--cobalt)}
.camtgl{position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px));z-index:5;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.camtgl[aria-pressed="false"]{border-color:var(--sun);color:var(--sun)}

/* step card */
.card{position:absolute;z-index:6;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--rule);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.16);
  display:flex;flex-direction:column;max-height:min(44%,520px);min-height:0}
@media (min-width:900px){.card{right:auto;width:440px;max-height:calc(100% - 64px)}}
.chead{display:flex;align-items:center;gap:10px;padding:9px 10px 6px 12px;min-width:0}
.chead .ttl{flex:1 1 auto;min-width:0}
.chead .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--sun)}
.chead h2{margin:1px 0 0;font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.25;text-wrap:balance}
.chead button{flex:none;width:30px;height:28px;border:1px solid var(--rule);background:var(--paper);border-radius:3px;cursor:pointer}
.cbody{overflow:auto;padding:0 12px 6px;min-height:0;overscroll-behavior:contain}
.card.min .cbody{display:none}
.cbody p{margin:0 0 8px;max-width:62ch}
.steps{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-2);padding:2px 6px;border-radius:3px}
.steps li b{font-family:var(--f-mono);font-weight:500;font-size:11px;min-width:16px}
.steps li.on{background:var(--cobalt-soft);color:var(--ink)}
.steps li.done{color:var(--ink)}
.kv{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;border-top:1px solid var(--rule-2);margin:0 0 8px}
.kv>*{padding:4px 6px 4px 0;border-bottom:1px solid var(--rule-2);font-size:12.5px;min-width:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv .st{justify-self:end;padding-right:0}
.st i{display:inline-block;min-width:18px;text-align:center;font-style:normal;font-family:var(--f-mono);font-size:10.5px;line-height:16px;border:1px solid currentColor;border-radius:3px}
.st .s-П{color:var(--st-p)} .st .s-Р{color:var(--st-r)} .st .s-З{color:var(--st-z)} .st .s-О{color:var(--st-o)}
.cnt{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 8px}
.cnt div{display:flex;flex-direction:column}
.cnt b{font-family:var(--f-display);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt span{font-size:11.5px;color:var(--ink-2)}
.legend{font-size:11px;color:var(--ink-2);margin:2px 0 6px;display:flex;flex-wrap:wrap;gap:2px 10px}
.legend .st i{margin-right:3px}
.note{font-size:12px;color:var(--st-o);margin:0 0 8px}

.trans{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px 9px;border-top:1px solid var(--rule-2)}
.trans button{flex:none;height:30px;min-width:32px;border:1px solid var(--rule);background:var(--paper);border-radius:3px;cursor:pointer;padding:0 7px}
.trans button:hover{border-color:var(--cobalt)}
.trans #play{min-width:40px;background:var(--cobalt);color:var(--panel);border-color:var(--cobalt)}
.trans #speed{font-family:var(--f-mono);font-size:12px;min-width:40px}
.tl{position:relative;flex:1 1 auto;min-width:60px;height:30px}
.tl input{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--cobalt)}
.tl .ticks{position:absolute;left:8px;right:8px;top:2px;height:4px;pointer-events:none}
.tl .ticks i{position:absolute;top:0;width:1px;height:6px;background:var(--ink-2);opacity:.5}
.trans output{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);min-width:38px;text-align:right}
@media (max-width:640px){.bar span{display:none}.bar{padding-block:5px}.bar h1{font-size:15px}.cbody{font-size:13px}.cbody p{margin-bottom:6px}.chead{padding:7px 8px 4px 10px}.chead h2{font-size:14px}.cnt b{font-size:15px}}
@media (max-width:520px){.trans{gap:4px;padding:6px 8px 8px}.trans button{min-width:30px;padding:0 5px}.trans output{display:none}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<div class="app">
  <header class="bar">
    <h1>Монтаж СЕС Антарес</h1>
    <span>дах цеху 96 × 96 м і склад · 1 440 панелей 730 Вт · трикутник 41×41 з шарніром, модифікація Антарес, 15°</span>
    <span class="code">ТОВ МК «Антарес» · м. Київ</span>
  </header>
  <section class="view" aria-label="3D-макет монтажу">
    <canvas id="gl"></canvas>
    <div class="loading" id="loading">Будую макет…</div>

    <div class="card" id="card">
      <div class="chead">
        <div class="ttl"><div class="eyebrow" id="eyebrow"></div><h2 id="atitle"></h2></div>

      </div>
      <div class="cbody" id="cbody"></div>
      <div class="trans">
        <button id="prev" aria-label="Попередній крок" title="Попередній крок">⏮</button>
        <button id="play" aria-label="Пуск" title="Пуск / пауза">▶</button>
        <button id="next" aria-label="Наступний крок" title="Наступний крок">⏭</button>
        <div class="tl"><div class="ticks" id="ticks"></div><input type="range" id="tl" min="0" max="1000" step="1" value="0" aria-label="Хід монтажу"></div>
        <output id="clock">0:00</output>
        <button id="speed" title="Швидкість">×1</button>
      </div>
    </div>
  </section>
</div>

   kv:[['Трикутників на панель','3, крайні спільні з сусідами','З'],['Точок кріплення','6','З'],['Притисків',`${nf(NCL)}: на стиках ${nf(NJOINT)}, посередині ${nf(NMID)}, на кінцях рядів ${nf(NEND)}`,'Р'],['Зона притиску','звірити з інструкцією Golen','О']], cnt:t=>[['притисків',`${nf(placed(clampMv,t))} / ${nf(NCL)}`]]},
 pFast:{p:'Панелі розносять зі стопок і притискають. Притиск на стику ставлять, коли лягла друга панель.', cnt:t=>[['панелей',`${nf(Math.min(NPAN,placed(modMv,t)))} / ${nf(NPAN)}`],['притисків',`${nf(placed(clampMv,t))} / ${nf(NCL)}`]]},
 pWh:{p:'На складі панелі лягають паралельно скату на блоки Light_P50-310.', cnt:t=>[['панелей усього',`${nf(placed(modMv,t))} / ${nf(NM)}`]]},
 cDemo:{p:'Стрінг із 10 панелей іде «підковою»: 5 по ряду і 5 назад по сусідньому ряду, тож обидва кінці приходять до щита. Панелі з’єднуються власними виводами, кабель кріпиться до конструкції під панелями.',
   kv:[['Панелей у стрінгу','10','Р'],['Uхх при −25 °C','567 В, межа PCS 660 В','Р'],['Кабель','H1Z2Z2-K 1×6','Р'],['Кріплення кабелю','стяжки до конструкції','О']]},
 cFast:{p:'Усі 144 стрінги приходять до 24 щитів, по 6 на щит. Колір лінії — щит, до якого йде стрінг.', kv:[['Кабель 1×6','6 208 м (без запасу)','Р'],['Роз’єми MC4','1 086','Р']]},
 cFeed:{p:'Від кожного щита до PCS іде лінія з двох алюмінієвих жил у лотках з кришками. Лотки стоять на гумових опорах і не кріпляться до покрівлі. Спуски — фасадом, за трасами проєкту.',
   kv:[['Лінії АВВГнг(А)-LS','1×120 — 1 520 м, 1×185 — 2 693 м','Р'],['Лотки','100×50 — 1 084 м, 200×50 — 121 м, 300×80 — 22 м, 400×100 — 75 м','Р'],['Опор лотків','794','Р'],['PCS','3 контейнери Golen LES-H20','З']]},
 lShow:{p:'Блискавкоприймач М-04/40 заввишки 4 м стоїть на бетонній основі. Між щоглами — дріт Ø8 на тримачах H-303.', note:mastMoved?`${mastMoved} щогл зсунуто до ${Math.round(mastMax*100)} см, щоб основа не стала на блоки нових трикутників — звірити з розділом БЗ.`:'',
   kv:[['Щогл на даху',`${MASTS.length} × М-04/40`,'П'],['Біля MS-3','2 × М-05/60 на тринозі','П'],['Основа','бетон, 32 кг','П']]},

 lDown:{p:'Спуски по фасадах ведуть до контрольних з’єднань і заземлювачів у землі.', kv:[['Спусків',`${DOWNS.length}`,'П']], cnt:t=>[['спусків',`${nf(downT.filter(x=>x+1.1<=t).length)} / ${DOWNS.length}`]]},
 lBond:{p:'Рами щитів і конструкції рядів з’єднують із системою блискавкозахисту провідником зрівнювання потенціалів.', kv:[['Провідник','≥ 16 мм² Cu (у проєкті 1×6 — замало)','Р'],['Траси','за ЕТР арк. 3',"П"]]},
 end:{p:`Станція змонтована: ${nf(NPAN+NWH)} панелей 730 Вт, ${nf((NPAN+NWH)*0.73,1)} кВтп.`,
   kv:[['Блоків',nf(NBLK),'Р'],['Трикутників',nf(NTRI),'Р'],['Притисків на цеху',nf(NCL),'Р'],['Щитів PV',`${DATA.box.length}`,'Р'],['Стрінгів','144 по 10','Р'],['Щогл','51 + 2','П']]}
};
const LEG=`<div class="legend">${Object.keys(S).map(k=>`<span>${st(k)}${S[k]}</span>`).join('')}</div>`;
let curAct=-1, cntTxt='';
function renderCard(a){ const c=CARD[a.id]||{}; $('#eyebrow').textContent=`${a.st} · ${STAGES[a.st]}`; $('#atitle').textContent=a.t;
  let h=''; if(c.p) h+=`<p>${c.p}</p>`; if(c.note) h+=`<p class="note">${c.note}</p>`;
  if(c.steps) h+=`<ol class="steps" id="steps">${ASM_STEPS.map((s,i)=>`<li data-i="${i}"><b>${i+1}</b>${s[0]}</li>`).join('')}</ol>`;
  h+=`<div class="cnt" id="cnt"></div>`; if(c.kv) h+=kv(c.kv)+LEG; $('#cbody').innerHTML=h; cntTxt=''; }
function cardTick(a,t){ const c=CARD[a.id]||{}; if(c.cnt){ const v=c.cnt(t), s=v.map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join(''); if(s!==cntTxt){ cntTxt=s; const el=$('#cnt'); if(el) el.innerHTML=s; } }
  if(c.steps){ const u=(t-a.s)/a.dur; document.querySelectorAll('#steps li').forEach((li,i)=>{ const s=ASM_STEPS[i]; li.classList.toggle('on',u>=s[1]&&u<s[2]); li.classList.toggle('done',u>=s[2]); }); } }

// ---------- transport and stage rail
const rail=$('#rail');
rail.innerHTML=STAGES.map((s,k)=>`<button data-k="${k}"><i>${k}</i>${s}</button>`).join('');
rail.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ seek(STS[+b.dataset.k]+0.001); }));
$('#ticks').innerHTML=STS.slice(1).map(s=>`<i style="left:${(s/TOTAL*100).toFixed(2)}%"></i>`).join('');
let tNow=0, playing=!RM, speed=1, lastApplied=-1;
const SPEEDS=[1,2,5,10,0.5];
function seek(t){ tNow=Math.max(0,Math.min(TOTAL,t)); jump=true; }
function actAt(t){ for(let i=ACTS.length-1;i>=0;i--) if(t>=ACTS[i].s) return ACTS[i]; return ACTS[0]; }
const playBtn=$('#play');
function setPlay(p){ playing=p; playBtn.textContent=p?'⏸':'▶'; playBtn.setAttribute('aria-label',p?'Пауза':'Пуск'); }
playBtn.addEventListener('click',()=>{ if(!playing&&tNow>=TOTAL-0.01) seek(0); setPlay(!playing); });
$('#prev').addEventListener('click',()=>{ const a=actAt(tNow); seek(tNow-a.s>1.2?a.s:(ACTS[Math.max(0,a.i-1)].s)); });
$('#next').addEventListener('click',()=>{ const a=actAt(tNow); seek(a.i<ACTS.length-1?ACTS[a.i+1].s:TOTAL); });
$('#speed').addEventListener('click',e=>{ speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; e.currentTarget.textContent='×'+String(speed).replace('.',','); });
const tl=$('#tl'); tl.addEventListener('input',()=>seek(tl.value/1000*TOTAL));
$('#cmin').addEventListener('click',e=>{ const c=$('#card'), m=c.classList.toggle('min'); e.currentTarget.textContent=m?'▴':'▾'; e.currentTarget.setAttribute('aria-expanded',String(!m)); e.currentTarget.title=m?'Показати опис':'Згорнути опис'; try{ localStorage.setItem('mont-min',m?'1':'0'); }catch(x){} });
try{ if(localStorage.getItem('mont-min')==='1') $('#cmin').click(); }catch(x){}
const camBtn=$('#camtgl');
function setAuto(v){ autoCam=v; camBtn.setAttribute('aria-pressed',String(v)); camBtn.textContent=v?'Камера: авто':'Камера: вільна'; if(v) jump=false; }
camBtn.addEventListener('click',()=>setAuto(!autoCam));
controls.addEventListener('start',()=>{ if(autoCam) setAuto(false); });
controls.addEventListener('change',()=>{ need=true; });
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); playBtn.click(); } });

// keep the subject in the part of the view the card does not cover
function viewOffset(){ const v=canvas.parentElement, w=v.clientWidth, h=v.clientHeight, c=$('#card').getBoundingClientRect(); let ox=0, oy=0;
  if(window.innerWidth>=900) ox=-(c.width+8)/2; else oy=Math.min(h*0.32,c.height/2);
  camera.setViewOffset(w,h,ox,oy,w,h); need=true; }
function resize(){ const v=canvas.parentElement, w=v.clientWidth, h=v.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(1,h); viewOffset(); camera.updateProjectionMatrix(); LMATS.forEach(m=>m.resolution.set(w*renderer.getPixelRatio(),h*renderer.getPixelRatio())); need=true; }
window.addEventListener('resize',resize); try{ new ResizeObserver(resize).observe(canvas.parentElement); new ResizeObserver(viewOffset).observe($('#card')); }catch(e){}
resize();

let prevT=performance.now(), railK=-1, tlTick=0;
function frame(now){ const dt=Math.min(0.1,(now-prevT)/1000); prevT=now;
  if(playing){ tNow+=dt*speed; if(tNow>=TOTAL){ tNow=TOTAL; setPlay(false); } }
  if(tNow!==lastApplied){ sceneAt(tNow); lastApplied=tNow; }
  const a=actAt(tNow), u=cl01((tNow-a.s)/a.dur);
  if(a.i!==curAct){ curAct=a.i; renderCard(a); }
  cardTick(a,tNow);
  if(a.st!==railK){ railK=a.st; rail.querySelectorAll('button').forEach((b,k)=>{ b.classList.toggle('on',k===a.st); b.classList.toggle('done',k<a.st); }); const on=rail.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
  if(now-tlTick>120){ tlTick=now; tl.value=Math.round(tNow/TOTAL*1000); const s=Math.floor(tNow); $('#clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  if(autoCam) camApply(a,u,dt); else controls.update();
  if(need||playing){ renderer.render(scene,camera); need=false; }
  requestAnimationFrame(frame); }
$('#loading').remove();
if(RM){ seek(TOTAL); setPlay(false); } else setPlay(true);
requestAnimationFrame(frame);
window.__mont={seek,pause:()=>setPlay(false),TOTAL,ACTS,demo:{blk:[BK.X,BK.Y],bp:[BP[0].X,BP[0].Y,BP[0].e],tri:[DT.X,DT.Y],tp:[TP[0].X,TP[0].Y],mod:[DM.cx,DM.Y],mp:[MP[0].X,MP[0].Y,MP[0].e]},counts:{NTRI,NBLK,NCL,NJOINT,NMID,NEND,boxes:DATA.box.length,mastMoved,mastMax,BP:BP.length,TP:TP.length,MP:MP.length}};
})();

</script>
